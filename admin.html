<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>M.M7 Admin Panel</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <h1 class="logo">M.M7 Crew 👑</h1>
    <p class="tagline">Admin Dashboard</p>

    <div id="admin-login" class="screen active">
      <h2>Admin Login</h2>
      <input type="email" id="admin-email" placeholder="Admin Email" />
      <input type="password" id="admin-password" placeholder="Admin Password" />
      <button id="admin-login-btn">Login</button>
      <p class="note">Use <b>admin@mm7.com</b> / <b>mm7admin</b></p>
    </div>

    <div id="admin-panel" class="screen">
      <div class="chat-header">
        <span>Customer Chats</span>
        <button id="admin-logout-btn">Logout</button>
      </div>
      <div id="admin-chat-box" class="chat-box"></div>
      <div class="chat-input">
        <input type="text" id="admin-message" placeholder="Type reply..." />
        <button id="admin-send-btn">Send</button>
      </div>
    </div>
  </div>

  <script src="admin.js"></script>
</body>
</html>
